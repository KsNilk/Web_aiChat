<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek V4 Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <span class="brand-name">DeepSeek</span>
                    <span class="brand-version">V4</span>
                </div>
                <button class="btn-new-session" id="btnNewSession">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    新对话
                </button>
            </div>

            <div class="session-list" id="sessionList"></div>

            <div class="sidebar-footer">
                <div class="config-indicator" id="configIndicator" title="未配置API Key">
                    <span class="config-dot"></span>
                    <span class="config-text">未配置</span>
                </div>
            </div>
        </aside>

        <!-- 主聊天区 -->
        <main class="chat-main">
            <!-- 顶部栏 -->
            <header class="chat-header">
                <button class="btn-toggle-sidebar" id="btnToggleSidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>

                <div class="session-title" id="sessionTitle">新对话</div>

                <div class="header-actions">
                    <div class="mode-switch" id="modeSwitch">
                        <button class="mode-option active" data-mode="flash">Flash</button>
                        <button class="mode-option" data-mode="pro">Pro</button>
                    </div>

                    <label class="think-toggle" id="thinkToggle">
                        <input type="checkbox" id="deepThinking">
                        <span class="think-label">深度思考</span>
                    </label>

                    <button class="btn-icon" id="btnMDRules" title="自定义规则">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                        </svg>
                    </button>

                    <button class="btn-icon" id="btnSettings" title="API设置">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- 消息区域 -->
            <div class="message-area" id="messageArea">
                <div class="message-list" id="messageList">
                    <div class="welcome" id="welcomeScreen">
                        <h2>DeepSeek V4</h2>
                        <p class="welcome-desc">Flash 快速响应 / Pro 专业分析</p>
                        <div class="quick-actions" id="quickActions">
                            <button class="quick-btn" data-prompt="分析当前技术行业发展趋势">行业趋势分析</button>
                            <button class="quick-btn" data-prompt="编写一个高效的排序算法并分析时间复杂度">算法编写与优化</button>
                            <button class="quick-btn" data-prompt="提供项目管理的核心方法论框架">项目管理方法论</button>
                            <button class="quick-btn" data-prompt="解释深度学习的基本原理和应用场景">深度学习原理</button>
                        </div>
                    </div>
                </div>

                <!-- Token用量指示器 (右下角竖条) -->
                <div class="token-meter" id="tokenMeter" title="Token用量">
                    <div class="token-meter-track">
                        <div class="token-meter-fill" id="tokenMeterFill"></div>
                    </div>
                    <div class="token-meter-info">
                        <span class="token-meter-value" id="tokenMeterValue">0%</span>
                        <span class="token-meter-label">100w</span>
                    </div>
                </div>
            </div>

            <!-- 输入区 -->
            <footer class="input-area">
                <div class="input-box">
                    <textarea id="messageInput" placeholder="输入消息，Enter 发送" rows="1" maxlength="4000"></textarea>
                    <div class="input-meta">
                        <span class="char-count" id="charCount">0/4000</span>
                        <span class="usage-inline" id="usageInline">Tokens: 0 | ¥0.0000</span>
                        <button class="btn-send" id="btnSend" disabled>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <p class="disclaimer">内容由AI生成，请核实关键信息</p>
            </footer>
        </main>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal hidden" id="settingsModal">
        <div class="modal-panel">
            <div class="modal-head">
                <h3>API 配置</h3>
                <button class="btn-close" id="btnCloseSettings">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="field">
                    <label>API Key</label>
                    <div class="password-field">
                        <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off"/>
                        <button class="btn-eye" id="btnTogglePassword">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <p class="hint">Key 以 YAML 格式存储在本地文件中，不上传至服务器</p>
                </div>
                <div class="field">
                    <label>Temperature: <span id="tempDisplay">0.7</span></label>
                    <input type="range" id="temperatureSlider" min="0" max="2" step="0.1" value="0.7"/>
                    <div class="range-labels"><span>精确</span><span>创造</span></div>
                </div>
                <div class="field">
                    <button class="btn-primary full" id="btnExportConfig">导出 YAML 配置</button>
                    <button class="btn-secondary full" id="btnImportConfig" style="margin-top:8px;">导入 YAML 配置</button>
                </div>
                <button class="btn-primary full" id="btnSaveSettings">保存</button>
            </div>
        </div>
    </div>

    <!-- MD规则弹窗 -->
    <div class="modal hidden" id="mdRulesModal">
        <div class="modal-panel modal-wide">
            <div class="modal-head">
                <h3>自定义规则</h3>
                <button class="btn-close" id="btnCloseMDRules">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="field">
                    <label>系统指令 (每次对话自动附加)</label>
                    <textarea id="mdRulesInput" class="code-input" placeholder="输入自定义规则，支持 Markdown 格式" rows="8"></textarea>
                </div>
                <div class="field">
                    <label class="checkbox-label">
                        <input type="checkbox" id="mdRulesEnabled" checked>
                        启用自定义规则
                    </label>
                </div>
                <button class="btn-primary full" id="btnSaveMDRules">保存规则</button>
            </div>
        </div>
    </div>

    <!-- Token满额提醒弹窗 -->
    <div class="modal hidden" id="tokenAlertModal">
        <div class="modal-panel modal-sm">
            <div class="modal-head">
                <h3>Token 用量提醒</h3>
                <button class="btn-close" id="btnCloseTokenAlert">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p class="alert-text" id="tokenAlertText"></p>
                <button class="btn-primary full" id="btnResetUsage">重置用量统计</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
